name: Reels idarə

# Paneldəki "Sil" və "Dəyişiklik" düymələri hazır doldurulmuş Issue açır.
# Bu workflow Issue başlığına görə işi görür:
#   "Yayımla: <id>"     → dərhal Instagram + Facebook-a yüklənir (paneldəki "Təsdiqlə")
#   "Sil: <id>"         → Release silinir, təsdiq Issue-su bağlanır, panel yenilənir
#   "Dəyişiklik: <id>"  → Issue mətnindəki qeyd ssenari modelinə ötürülür,
#                          video eyni məqalədən YENİDƏN istehsal olunur, Release əvəz olunur

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------ YAYIMLA
  publish:
    if: startsWith(github.event.issue.title, 'Yayımla:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_GRAPH_VERSION: v21.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci

      - name: ID
        id: pick
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "id=$(printf '%s' "$TITLE" | sed 's/^Yayımla:[[:space:]]*//' | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Instagram + Facebook
        id: pub
        run: |
          set -o pipefail
          ID="${{ steps.pick.outputs.id }}"
          gh issue comment ${{ github.event.issue.number }} --body "🚀 Yayımlanır… (Instagram videonu emal edir, ~2 dəq)"
          URL="https://github.com/${{ github.repository }}/releases/download/reel-$ID/$ID.mp4"
          if ! npx tsx pipeline/publish.ts "$URL" "content/data/$ID.meta.json" 2>&1 | tee pub.log; then
            ERR=$(tail -n 5 pub.log | paste -sd ' ' | cut -c1-400)
            gh issue comment ${{ github.event.issue.number }} --body "❌ Yayım alınmadı: $ERR
          Video paneldə 'təsdiq gözləyir' olaraq qalır — bir də Yayımla basa bilərsən."
            gh issue close ${{ github.event.issue.number }} --reason "not planned"
            exit 1
          fi
          IG=$(grep -oE 'https://www.instagram.com[^ ]*' pub.log | head -1)
          if [ -z "$IG" ]; then echo "Instagram linki tapılmadı — yayım şübhəlidir"; exit 1; fi
          echo "ig=$IG" >> "$GITHUB_OUTPUT"
          echo "fb=$(grep -oE 'https://www.facebook.com/reel/[0-9]+' pub.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Status, panel, Issue-lar
        run: |
          ID="${{ steps.pick.outputs.id }}"
          python - <<PY
          import json, io, os
          p = "content/data/status.json"
          d = json.load(io.open(p, encoding="utf-8")) if os.path.exists(p) else {}
          d["$ID"] = {**d.get("$ID", {}), "status": "yayımlanıb",
                      "instagram": "${{ steps.pub.outputs.ig }}", "facebook": "${{ steps.pub.outputs.fb }}"}
          io.open(p, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2))
          PY
          npx tsx pipeline/panel.ts "$ID" "${{ github.repository }}"
          bash pipeline/sync_push.sh "yayımlandı: $ID" "${{ github.repository }}" content/data/status.json docs/data.json
          for n in $(gh issue list --state open --search "Təsdiq: $ID in:title" --json number -q '.[].number'); do
            gh issue close "$n" --comment "✅ Paneldən yayımlandı."
          done
          gh issue close ${{ github.event.issue.number }} --comment "✅ Yayımlandı.
          Instagram: ${{ steps.pub.outputs.ig }}
          Facebook: ${{ steps.pub.outputs.fb }}"

  # ------------------------------------------------------------------ SİL
  delete:
    if: startsWith(github.event.issue.title, 'Sil:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci

      - name: ID
        id: pick
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "id=$(printf '%s' "$TITLE" | sed 's/^Sil:[[:space:]]*//' | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Release-i sil, statusu yaz, təsdiq Issue-sunu bağla
        run: |
          ID="${{ steps.pick.outputs.id }}"
          gh release delete "reel-$ID" --yes --cleanup-tag 2>/dev/null || true
          python - <<PY
          import json, io, os
          p = "content/data/status.json"
          d = json.load(io.open(p, encoding="utf-8")) if os.path.exists(p) else {}
          d["$ID"] = {**d.get("$ID", {}), "status": "silinib"}
          io.open(p, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2))
          PY
          for n in $(gh issue list --state open --search "Təsdiq: $ID in:title" --json number -q '.[].number'); do
            gh issue close "$n" --reason "not planned" --comment "Paneldən silindi."
          done
          npx tsx pipeline/panel.ts "$ID" "${{ github.repository }}"
          bash pipeline/sync_push.sh "silindi: $ID" "${{ github.repository }}" content/data/status.json docs/data.json
          gh issue close ${{ github.event.issue.number }} --comment "✅ Silindi: Release ləğv edildi, paneldən çıxarıldı."

  # ------------------------------------------------------------------ DƏYİŞİKLİK
  revise:
    if: startsWith(github.event.issue.title, 'Dəyişiklik:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      AUDIUS_API_TOKEN: ${{ secrets.AUDIUS_API_TOKEN }}
      # OPENAI_TTS_VOICE boşdursa hər video fərqli səslə çıxır (rotasiya); sabit istəsən Variables-də təyin et
      OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
      OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts-2025-12-15' }}
      # Issue mətni = sənin qeydin → ssenari promptuna gedir
      FEEDBACK: ${{ github.event.issue.body }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      LLM_ENGINE: ${{ vars.LLM_ENGINE || 'openai-first' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'openai-first' }}
      IMAGE_ENGINE: ${{ vars.IMAGE_ENGINE || 'openai' }}
      NOVELTY: ${{ vars.NOVELTY || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libgbm1 fonts-liberation || true
      - run: npm ci
      - run: pip install --quiet edge-tts mutagen numpy pillow

      - name: ID və məqalə
        id: pick
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          ID=$(printf '%s' "$TITLE" | sed 's/^Dəyişiklik:[[:space:]]*//' | tr -d ' ')
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "article=$(python -c "import json,io;print(json.load(io.open('content/data/$ID.meta.json',encoding='utf-8')).get('articleId') or '')")" >> $GITHUB_OUTPUT
          echo "template=$(python -c "import json,io;print(json.load(io.open('content/data/$ID.meta.json',encoding='utf-8')).get('template','TipList'))")" >> $GITHUB_OUTPUT

      - name: Qeydi anla (interpretator)
        id: plan
        run: |
          ID="${{ steps.pick.outputs.id }}"
          npx tsx pipeline/interpret.ts "content/data/$ID.meta.json" "$FEEDBACK"
          SUMMARY=$(python -c "import json,io;print(json.load(io.open('feedback-plan.json',encoding='utf-8'))['summary'])")
          gh issue comment ${{ github.event.issue.number }} --body "🧠 Belə başa düşdüm: $SUMMARY
          🔄 Yenidən istehsal olunur (~6 dəq)…"

      - name: Assetləri yenilə (lazımdırsa)
        if: steps.plan.outputs.asset_hints != '' && steps.pick.outputs.template != 'Story'
        run: |
          pip install --quiet pillow
          export FEEDBACK_PLAN=feedback-plan.json
          npx tsx -e "import './pipeline/plan.ts'" >/dev/null
          python - <<PY
          import json,io,os,subprocess
          p=json.load(io.open("feedback-plan.json",encoding="utf-8"))
          env=dict(os.environ, VISUAL_NOTES=p.get("visualNotes",""), IMAGE_REFS=",".join(p.get("imageRefs",[])))
          subprocess.run(["python","pipeline/gen_assets.py",*p["assetHints"]], env=env, check=True)
          PY

      - name: Qeydlə yenidən istehsal
        env:
          ARTICLE_ID: ${{ steps.pick.outputs.article }}
          REEL_ID: ${{ steps.pick.outputs.id }}
        run: |
          # şablon qeydə görə dəyişə bilər (plan.template), yoxsa mövcud
          T="${{ steps.plan.outputs.template }}"; [ -z "$T" ] && T="${{ steps.pick.outputs.template }}"
          echo "şablon: $T"
          case "$T" in
            Explainer) npx tsx pipeline/explainer.ts ;;
            Story) npx tsx pipeline/story.ts ;;
            Carousel) npx tsx pipeline/carousel.ts ;;
            Poster) POSTER_COUNT=1 POSTER_MIX=$(python -c "import json,io;print(json.load(io.open('content/data/$ID.meta.json',encoding='utf-8')).get('kind','sales'))" 2>/dev/null || echo sales) npx tsx pipeline/poster.ts ;;
            *) npx tsx pipeline/run.ts ;;
          esac
          echo "template=$T" >> "$GITHUB_OUTPUT"

      - name: Render + QA
        run: |
          ID="${{ steps.pick.outputs.id }}"
          mkdir -p out
          T="${{ steps.plan.outputs.template }}"; [ -z "$T" ] && T="${{ steps.pick.outputs.template }}"
          if [ "$T" = "Carousel" ]; then
            for i in 0 1 2; do npx remotion still src/index.ts Carousel "out/$ID-$((i+1)).png" --frame=$i --props="public/render/$ID/props.json"; done
          elif [ "$T" = "Poster" ]; then
            npx remotion still src/index.ts Poster "out/$ID-1.png" --frame=0 --props="public/render/$ID/props.json"
          else
            npx remotion render src/index.ts "$T" "out/$ID.mp4" --props="public/render/$ID/props.json"
            npx tsx pipeline/qa.ts "out/$ID.mp4" "public/render/$ID/props.json"
          fi
          npx tsx pipeline/copy.ts "$ID"

      - name: Release-i əvəz et, panel, Issue
        run: |
          ID="${{ steps.pick.outputs.id }}"
          gh release delete "reel-$ID" --yes --cleanup-tag 2>/dev/null || true
          gh release create "reel-$ID" out/$ID* --title "Reel $ID (düzəliş)" --notes "Qeydlə yenidən istehsal olunub."
          python - <<PY
          import json, io, os
          p = "content/data/status.json"
          d = json.load(io.open(p, encoding="utf-8")) if os.path.exists(p) else {}
          plan = json.load(io.open("feedback-plan.json", encoding="utf-8")) if os.path.exists("feedback-plan.json") else {}
          d["$ID"] = {**d.get("$ID", {}), "status": "təsdiq-gözləyir", "note": (plan.get("summary") or os.environ.get("FEEDBACK", ""))[:400]}
          io.open(p, "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2))
          PY
          npx tsx pipeline/panel.ts "$ID" "${{ github.repository }}"
          bash pipeline/sync_push.sh "düzəliş: $ID" "${{ github.repository }}" docs/data.json content/data content/articles-cache.json content/trends.json public/render public/assets src/assetBounds.json
          gh issue comment ${{ github.event.issue.number }} --body "✅ Yeni versiya hazırdır: https://github.com/${{ github.repository }}/releases/download/reel-$ID/$ID.mp4
          Təsdiq üçün əvvəlki 'Təsdiq: $ID' Issue-suna \`/publish\` yaz."
          gh issue close ${{ github.event.issue.number }}
