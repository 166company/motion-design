name: Həftəlik analitika + plan

on:
  schedule:
    # Bazar ertəsi 06:00 UTC = 10:00 Bakı — rəqəmlər, yaddaş, 2 həftəlik plan
    - cron: "0 6 * * 1"
    # Hər saat — şərhlər (yalnız AUTO_REPLY=1 dəyişəni varsa cavab göndərir, yoxsa önizləmə)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "weekly | comments"
        default: "weekly"

permissions:
  contents: write
  issues: write

jobs:
  weekly:
    if: github.event.schedule == '0 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.job == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci

      - name: "Rəqəmlər + oxunuş + yaddaş (analytics-readout, hook-mining, ai-brain)"
        run: npx tsx pipeline/analytics.ts

      - name: "2 həftəlik plan (content-calendar, pillars, series)"
        run: npx tsx pipeline/calendar.ts

      - name: "Saxla"
        run: |
          bash pipeline/sync_push.sh "həftəlik analitika + plan" "${{ github.repository }}" content/analytics.json content/brain.md content/calendar.json content/trends.json content/articles-cache.json docs/data.json

      - name: "Hesabat Issue-su"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/readout.md ]; then
            gh label create "hesabat" --color 1E2124 --force 2>/dev/null || true
            gh issue create --title "📊 Həftəlik hesabat: $(date -u +%Y-%m-%d)" --label "hesabat" --body-file out/readout.md
          fi

  comments:
    if: github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'comments')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      AUTO_REPLY: ${{ vars.AUTO_REPLY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - name: "Şərhlər (comment-responder)"
        run: npx tsx pipeline/comments.ts
      - name: "Saxla"
        run: |
          bash pipeline/sync_push.sh "şərhlər" "${{ github.repository }}" content/data/comments.json docs/data.json
