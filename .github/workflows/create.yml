name: Reels yarat

on:
  schedule:
    # Bazar ertəsi / Çərşənbə / Cümə — 14:30 UTC = 18:30 Bakı (video növbəsi, təqvimə görə)
    - cron: "30 14 * * 1,3,5"
    # Çərşənbə axşamı / Cümə axşamı / Şənbə — illüstrasiya/animasiya günü (Story | Explainer, təqvimə görə)
    - cron: "30 14 * * 2,4,6"
    # Hər gün 05:00 UTC = 09:00 Bakı — 3 statik satış postu
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      template:
        description: "Şablon: auto (növbə), tiplist, explainer, explainer-silent, story, story-silent, carousel, poster"
        default: "auto"

permissions:
  contents: write
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      AUDIUS_API_TOKEN: ${{ secrets.AUDIUS_API_TOKEN }}
      # OPENAI_TTS_VOICE boşdursa hər video fərqli səslə çıxır (rotasiya); sabit istəsən Variables-də təyin et
      OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
      OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts-2025-12-15' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'az-AZ-BanuNeural' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      LLM_ENGINE: ${{ vars.LLM_ENGINE || 'openai-first' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'openai-first' }}
      IMAGE_ENGINE: ${{ vars.IMAGE_ENGINE || 'openai' }}
      NOVELTY: ${{ vars.NOVELTY || '1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Chrome üçün sistem kitabxanaları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libasound2t64 libgbm1 fonts-liberation || true

      - run: npm ci
      - run: pip install --quiet edge-tts mutagen numpy pillow

      - name: Musiqi kataloqu + vokal yoxlaması
        # yeni trek yoxdursa dərhal bitir; varsa ~0.5 sent/trek (Whisper)
        run: |
          npx tsx pipeline/audius.ts > /dev/null
          python pipeline/screen_music.py

      - name: Şablon seçimi
        id: tpl
        env:
          REQ: ${{ inputs.template || 'auto' }}
        run: |
          # auto növbəsi: tiplist, story, tiplist, explainer, ... (məqalə videoları arasında animasiyalar)
          N=$(ls content/data/*.meta.json 2>/dev/null | grep -vc poster)
          # kontent təqvimində (calendar.ts) bu gün üçün video slotu varsa, onun şablonu
          CAL=$(python -c "import json,io,datetime;c=json.load(io.open('content/calendar.json',encoding='utf-8'));d=datetime.date.today().isoformat();print(next((s['template'].lower() for s in c['slots'] if s['date']==d and s['template']!='Poster'),''))" 2>/dev/null || true)
          if [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then T=poster
          elif [ "$REQ" = "auto" ] && [ -n "$CAL" ]; then T="$CAL"; echo "təqvimdən: $CAL"
          elif [ "${{ github.event.schedule }}" = "30 14 * * 2,4,6" ]; then case $((N % 2)) in 0) T=story ;; *) T=explainer ;; esac
          elif [ "$REQ" = "auto" ]; then
            case $((N % 4)) in 0) T=story ;; 1) T=explainer ;; 2) T=carousel ;; *) T=tiplist ;; esac
          else T="$REQ"; fi
          echo "template=$T" >> "$GITHUB_OUTPUT"
          echo "şablon: $T (mövcud: $N)"

      - name: Ssenari + səs + assetlər
        env:
          EXPLAINER_SILENT: ${{ endsWith(steps.tpl.outputs.template, '-silent') && '1' || '' }}
        run: |
          case "${{ steps.tpl.outputs.template }}" in
            explainer|explainer-silent) npx tsx pipeline/explainer.ts ;;
            story|story-silent) npx tsx pipeline/story.ts ;;
            carousel) npx tsx pipeline/carousel.ts ;;
            poster) npx tsx pipeline/poster.ts ;;
            *) npx tsx pipeline/run.ts ;;
          esac

      - name: ID-ləri oxu
        id: reel
        run: |
          # poster.ts bir dəfəyə bir neçə ID yaradır (out/new-ids.txt); digərləri tək ID
          if [ -f out/new-ids.txt ]; then IDS=$(paste -sd ' ' out/new-ids.txt); else IDS=$(ls -1t public/render | head -1); fi
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "id=$(echo $IDS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ID-lər: $IDS"

      - name: Kopiya (caption-and-hashtags → caption, pilləli hashtag-lər, ilk şərh)
        run: |
          for ID in ${{ steps.reel.outputs.ids }}; do npx tsx pipeline/copy.ts "$ID"; done

      - name: Render
        run: |
          mkdir -p out
          for ID in ${{ steps.reel.outputs.ids }}; do
            COMP=$(python -c "import json,io;print(json.load(io.open('content/data/$ID.meta.json',encoding='utf-8')).get('template','TipList'))")
            echo "== $ID → $COMP"
            case "$COMP" in
              Carousel) for i in 0 1 2; do npx remotion still src/index.ts Carousel "out/$ID-$((i+1)).png" --frame=$i --props="public/render/$ID/props.json"; done ;;
              Poster)   npx remotion still src/index.ts Poster "out/$ID-1.png" --frame=0 --props="public/render/$ID/props.json" ;;
              *)        npx remotion render src/index.ts "$COMP" "out/$ID.mp4" --props="public/render/$ID/props.json" ;;
            esac
          done

      - name: QA
        run: |
          for ID in ${{ steps.reel.outputs.ids }}; do
            if [ -f "out/$ID.mp4" ]; then npx tsx pipeline/qa.ts "out/$ID.mp4" "public/render/$ID/props.json"
            else ls -la out/$ID-*.png && echo "QA: $ID şəkilləri hazırdır"; fi
          done

      - name: Release yarat (ictimai video linki)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ID in ${{ steps.reel.outputs.ids }}; do
            # Eyni ID yenidən istehsal olunursa, köhnə Release-i əvəz et
            gh release delete "reel-$ID" --yes --cleanup-tag 2>/dev/null || true
            gh release create "reel-$ID" out/$ID* --title "Reel $ID" --notes "Avtomatik yaradılıb. Təsdiq üçün Issue-ya bax."
          done

      - name: Panel məlumatını yenilə
        run: npx tsx pipeline/panel.ts "${{ steps.reel.outputs.id }}" "${{ github.repository }}"

      - name: Dəyişiklikləri saxla
        run: |
          bash pipeline/sync_push.sh "reel: ${{ steps.reel.outputs.ids }}" "${{ github.repository }}" docs/data.json content/data content/articles-cache.json content/trends.json public/render

      - name: Təsdiq üçün Issue aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "təsdiq-gözləyir" --color FF6600 --force 2>/dev/null || true
          for ID in ${{ steps.reel.outputs.ids }}; do
            # Eyni ID yenidən istehsal olunubsa köhnə təsdiq Issue-sunu bağla — paneldə ikiləşməsin
            for N in $(gh issue list --state open --search "\"Təsdiq: $ID\" in:title" --json number,title -q ".[] | select(.title == \"Təsdiq: $ID\") | .number"); do
              gh issue close "$N" --comment "Yenidən istehsal olundu — yeni Issue açılır." || true
            done
            python pipeline/issue_body.py "$ID" "$REPO" > issue.md
            gh issue create --title "Təsdiq: $ID" --label "təsdiq-gözləyir" --body-file issue.md
          done
