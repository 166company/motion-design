name: Reels yarat

on:
  schedule:
    # Bazar ertəsi / Çərşənbə / Cümə — 14:30 UTC = 18:30 Bakı
    - cron: "30 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      template:
        description: "Şablon: auto (növbə), tiplist, explainer, explainer-silent, story, story-silent, carousel"
        default: "auto"

permissions:
  contents: write
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      AUDIUS_API_TOKEN: ${{ secrets.AUDIUS_API_TOKEN }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'openai' }}
      # OPENAI_TTS_VOICE boşdursa hər video fərqli səslə çıxır (rotasiya); sabit istəsən Variables-də təyin et
      OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
      OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts-2025-12-15' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'az-AZ-BanuNeural' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Chrome üçün sistem kitabxanaları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libasound2t64 libgbm1 fonts-liberation || true

      - run: npm ci
      - run: pip install --quiet edge-tts mutagen numpy

      - name: Musiqi kataloqu + vokal yoxlaması
        # yeni trek yoxdursa dərhal bitir; varsa ~0.5 sent/trek (Whisper)
        run: |
          npx tsx pipeline/audius.ts > /dev/null
          python pipeline/screen_music.py

      - name: Şablon seçimi
        id: tpl
        env:
          REQ: ${{ inputs.template || 'auto' }}
        run: |
          # auto növbəsi: tiplist, story, tiplist, explainer, ... (məqalə videoları arasında animasiyalar)
          N=$(ls content/data/*.meta.json 2>/dev/null | wc -l)
          if [ "$REQ" = "auto" ]; then
            case $((N % 5)) in 1) T=story ;; 2) T=carousel ;; 4) T=explainer ;; *) T=tiplist ;; esac
          else T="$REQ"; fi
          echo "template=$T" >> "$GITHUB_OUTPUT"
          echo "şablon: $T (mövcud: $N)"

      - name: Ssenari + səs + assetlər
        env:
          EXPLAINER_SILENT: ${{ endsWith(steps.tpl.outputs.template, '-silent') && '1' || '' }}
        run: |
          case "${{ steps.tpl.outputs.template }}" in
            explainer|explainer-silent) npx tsx pipeline/explainer.ts ;;
            story|story-silent) npx tsx pipeline/story.ts ;;
            carousel) npx tsx pipeline/carousel.ts ;;
            *) npx tsx pipeline/run.ts ;;
          esac

      - name: ID-ni oxu
        id: reel
        run: echo "id=$(ls -1t public/render | head -1)" >> $GITHUB_OUTPUT

      - name: Render
        run: |
          mkdir -p out
          ID="${{ steps.reel.outputs.id }}"
          # Kompozisiya meta-dakı şablondan gəlir: TipList / Explainer / Story
          COMP=$(python -c "import json,io;print(json.load(io.open('content/data/$ID.meta.json',encoding='utf-8')).get('template','TipList'))")
          echo "kompozisiya: $COMP"
          if [ "$COMP" = "Carousel" ]; then
            for i in 0 1 2; do npx remotion still src/index.ts Carousel "out/$ID-$((i+1)).png" --frame=$i --props="public/render/$ID/props.json"; done
          else
            npx remotion render src/index.ts "$COMP" "out/$ID.mp4" --props="public/render/$ID/props.json"
          fi

      - name: QA
        run: |
          ID="${{ steps.reel.outputs.id }}"
          if [ -f "out/$ID.mp4" ]; then
            npx tsx pipeline/qa.ts "out/$ID.mp4" "public/render/$ID/props.json"
          else
            ls -la out/$ID-*.png && [ $(ls out/$ID-*.png | wc -l) -ge 3 ] && echo "QA: 3 slayd hazırdır"
          fi

      - name: Release yarat (ictimai video linki)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Eyni ID yenidən istehsal olunursa, köhnə Release-i əvəz et
          gh release delete "reel-${{ steps.reel.outputs.id }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "reel-${{ steps.reel.outputs.id }}" \
            out/${{ steps.reel.outputs.id }}* \
            --title "Reel ${{ steps.reel.outputs.id }}" \
            --notes "Avtomatik yaradılıb. Təsdiq üçün Issue-ya bax."

      - name: Panel məlumatını yenilə
        run: npx tsx pipeline/panel.ts "${{ steps.reel.outputs.id }}" "${{ github.repository }}"

      - name: Dəyişiklikləri saxla
        run: |
          git config user.name "yukaz-agent"
          git config user.email "actions@github.com"
          git add docs/data.json content/data public/render
          git commit -m "reel: ${{ steps.reel.outputs.id }}" || echo "dəyişiklik yoxdur"
          # Workflow işləyərkən main-ə başqa push gəlibsə, üstünə qoy — toqquşma olmasın
          git pull --rebase --autostash -X theirs origin main
          git push

      - name: Təsdiq üçün Issue aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.reel.outputs.id }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "təsdiq-gözləyir" --color FF6600 --force 2>/dev/null || true
          python pipeline/issue_body.py "$ID" "$REPO" > issue.md
          gh issue create --title "Təsdiq: $ID" --label "təsdiq-gözləyir" --body-file issue.md
