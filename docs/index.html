<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuk.az — Reels Paneli</title>
<link rel="icon" href="logo-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF6600; --graphite:#1E2124; --soft:#2A2E32;
    --white:#fff; --neutral:#F5F5F3; --muted:rgba(255,255,255,.58);
    --line:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--graphite);color:var(--white);
       font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
         flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:38px;height:38px}
  .brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.4px}
  .brand span{color:var(--orange)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;
        padding:10px 16px;min-width:96px}
  .stat b{display:block;font-size:22px;font-weight:900;line-height:1.1}
  .stat small{color:var(--muted);font-size:11px;font-weight:600;
              text-transform:uppercase;letter-spacing:.5px}
  .tabs{display:flex;gap:8px;margin:24px 0 20px;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid var(--line);color:var(--muted);
       padding:9px 18px;border-radius:999px;font:inherit;font-weight:700;
       font-size:13px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:var(--graphite)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:20px;
        overflow:hidden;display:flex;flex-direction:column}
  .card video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
  .ph{width:100%;aspect-ratio:9/16;background:linear-gradient(160deg,#23272b,#1a1d20);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;text-align:center;padding:24px;color:var(--muted)}
  .ph b{color:var(--white);font-size:14px;font-weight:800}
  .ph span{font-size:12px;line-height:1.5;max-width:220px}
  .ph .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);
           animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .hook{font-weight:900;font-size:16px;line-height:1.25;margin:0}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;
        color:var(--muted);font-weight:600}
  .pill{padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.wait{background:rgba(255,102,0,.14);border-color:rgba(255,102,0,.4);color:#FFB273}
  .pill.done{background:rgba(76,217,123,.12);border-color:rgba(76,217,123,.35);color:#7EE0A4}
  .pill.skip{opacity:.6}
  .music{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;
         color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);
         border-radius:12px;padding:8px 10px}
  .music b{color:var(--white);font-weight:700}
  .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.3px}
  .tag.ok{background:rgba(76,217,123,.14);color:#7EE0A4}
  .tag.warn{background:rgba(255,102,0,.16);color:#FFB273}
  .tag.dim{background:rgba(255,255,255,.08);color:var(--muted)}
  .cap{font-size:12.5px;line-height:1.5;color:var(--muted);margin:0;
       display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .actions{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
  .btn{flex:1;min-width:110px;text-align:center;text-decoration:none;padding:10px 12px;
       border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;
       border:1px solid var(--line);background:transparent;color:var(--white);font-family:inherit}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:var(--graphite)}
  .btn.danger{border-color:rgba(255,80,80,.35);color:#FF8A8A}
  .btn.ghost{flex:0 0 auto;min-width:0;padding:10px 14px}
  .note{font-size:12px;line-height:1.45;color:#FFB273;background:rgba(255,102,0,.08);
        border:1px dashed rgba(255,102,0,.35);border-radius:10px;padding:8px 10px}
  .note b{display:block;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px;color:var(--orange)}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .gear{background:var(--soft);border:1px solid var(--line);color:var(--white);border-radius:12px;
        padding:10px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .gear.on{border-color:rgba(76,217,123,.5);color:#7EE0A4}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111315;color:var(--white);
         border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13.5px;font-weight:600;
         box-shadow:0 20px 50px rgba(0,0,0,.6);max-width:92vw;z-index:9;display:none}
  .toast a{color:var(--orange)}
  .pill.busy{background:rgba(120,160,255,.14);border-color:rgba(120,160,255,.4);color:#B9C8FF}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12px;display:flex;justify-content:space-between;
         gap:12px;flex-wrap:wrap}
  a{color:var(--orange)}
  @media(max-width:520px){ .grid{grid-template-columns:1fr} .wrap{padding:20px 14px 60px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo-icon.svg" alt="">
      <div>
        <h1>yuk<span>.az</span> — Reels Paneli</h1>
        <div class="sub" id="updated">yüklənir…</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="stats" id="stats"></div>
      <button class="gear" id="gear" title="Bir-klik yayım üçün GitHub tokeni">⚙️ Token</button>
    </div>
  </header>
  <div class="toast" id="toast"></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-f="all" aria-selected="true">Hamısı</button>
    <button class="tab" data-f="təsdiq-gözləyir" aria-selected="false">Təsdiq gözləyir</button>
    <button class="tab" data-f="yayımlanıb" aria-selected="false">Yayımlanıb</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Hələ video yoxdur.</div>

  <footer>
    <span>Mənbə: yuk.az məqalələri · Səs: OpenAI TTS · Render: Remotion</span>
    <span id="repo"></span>
  </footer>
</div>

<script>
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ESCAPES[c]);
const NL = "\n";

let DATA = { entries: [], repo: "" };
let filter = "all";

const badgeClass = (s) =>
  s === "yayımlanıb" ? "done" : s === "imtina" ? "skip" : s === "yayımlanır" ? "busy" : "wait";

/* ---------------- bir-klik: token yalnız brauzerdə, API çağırışı paneldən ---------------- */
const TOKEN_KEY = "yukaz_gh_token";
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } };
let toastTimer = null;
const toast = (html, ms) => {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, ms || 6000);
};
const refreshGear = () => {
  const g = document.getElementById("gear");
  const on = !!getToken();
  g.textContent = on ? "✓ Bir-klik aktiv" : "⚙️ Token";
  g.classList.toggle("on", on);
};
document.getElementById("gear").onclick = () => {
  const cur = getToken();
  const v = prompt(
    "Bir-klik yayım üçün GitHub fine-grained token yapışdır." + NL +
    "github.com/settings/personal-access-tokens → Generate → Repository: motion-design → Permissions: Issues: Read and write." + NL +
    "Token yalnız bu brauzerdə saxlanır, səhifənin koduna düşmür. Silmək üçün boş buraxıb OK bas.",
    cur
  );
  if (v === null) return;
  try { if (v.trim()) localStorage.setItem(TOKEN_KEY, v.trim()); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  refreshGear();
  toast(v.trim() ? "Token saxlanıldı — düymələr indi birbaşa işləyir." : "Token silindi — düymələr GitHub səhifəsini açacaq.");
};

async function createIssue(title, body) {
  const r = await fetch("https://api.github.com/repos/" + DATA.repo + "/issues", {
    method: "POST",
    headers: { Authorization: "Bearer " + getToken(), Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ title: title, body: body }),
  });
  if (!r.ok) throw new Error("GitHub " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}

// Musiqi sətri: trek, lisenziya və Whisper vokal yoxlamasının nəticəsi
function musicRow(m) {
  if (!m) return "";
  const vocal =
    m.vocal === true  ? '<span class="tag warn">VOKAL</span>' :
    m.vocal === false ? '<span class="tag ok">İNSTRUMENTAL ✓</span>' :
                        '<span class="tag dim">YOXLANMAYIB</span>';
  const lic = m.license ? '<span class="tag dim">' + esc(m.license) + '</span>' : "";
  const src = m.source === "audius" ? "Audius" : m.source === "local" ? "Lokal" : "Sintez";
  return '<div class="music">🎵 <b>' + esc(m.label) + '</b>' +
         '<span class="tag dim">' + src + '</span>' + lic + vocal + '</div>';
}

// Sil / Dəyişiklik / Yayımla: token varsa panel Issue-nu özü yaradır (bir klik),
// yoxsa hazır doldurulmuş Issue səhifəsi açılır. manage.yml başlığa görə işi görür.
const newIssue = (title, body) =>
  "https://github.com/" + esc(DATA.repo) + "/issues/new?title=" +
  encodeURIComponent(title) + "&body=" + encodeURIComponent(body);
const changeBody =
  "Bu videoda nə dəyişməlidir? Aşağıya sərbəst yaz — qeyd ssenari modelinə ötürülür və video yenidən istehsal olunur." + NL + NL +
  "Məsələn: başlıqlar daha qısa olsun / musiqi daha gümrah / 3-cü bənd lazım deyil" + NL + NL + "---" + NL + NL;

function render() {
  const list = DATA.entries.filter((e) => filter === "all" || e.status === filter);
  const grid = document.getElementById("grid");
  document.getElementById("empty").hidden = list.length > 0;

  grid.innerHTML = list.map((e) => {
    const busy = e.status === "yayımlanır";
    const right =
      e.status === "yayımlanıb"
        ? '<a class="btn primary" target="_blank" rel="noopener" href="' + esc(e.instagram || "#") + '">Instagram-da bax</a>'
        : busy
          ? '<span class="btn" style="opacity:.6">⏳ Yayımlanır…</span>'
          : '<a class="btn primary" data-act="publish" data-id="' + esc(e.id) + '" target="_blank" rel="noopener" href="' +
            newIssue("Yayımla: " + e.id, "Bu video Instagram + Facebook-a yayımlansın.") + '">🚀 Yayımla</a>';
    const manage =
      '<a class="btn" data-act="change" data-id="' + esc(e.id) + '" target="_blank" rel="noopener" href="' +
        newIssue("Dəyişiklik: " + e.id, changeBody) + '">✏️ Dəyişiklik</a>' +
      '<a class="btn danger ghost" data-act="delete" data-id="' + esc(e.id) + '" target="_blank" rel="noopener" href="' +
        newIssue("Sil: " + e.id, "Bu video paneldən və Release-dən silinsin.") + '">🗑</a>';
    const note = e.note ? '<div class="note"><b>Son qeyd</b>' + esc(e.note) + '</div>' : "";

    return '<article class="card">' +
      '<div class="slot" data-src="' + esc(e.video) + '">' +
        '<div class="ph"><div class="dot"></div>' +
        '<b>Video hazırlanır</b>' +
        '<span>GitHub Release-ə yüklənəndən sonra burada oynayacaq.</span></div>' +
      '</div>' +
      '<div class="body">' +
        '<p class="hook">' + esc(e.hook) + '</p>' +
        '<div class="meta">' +
          '<span class="pill ' + badgeClass(e.status) + '">' + esc(e.status) + '</span>' +
          '<span class="pill">' + esc(e.duration) + ' san</span>' +
          '<span class="pill">' + esc(e.scenes) + ' səhnə</span>' +
          '<span class="pill">' + esc(e.createdAt) + '</span>' +
          '<span class="pill">' + (e.template === "Explainer" ? "🎬 Animasiya" : "📰 Məqalə") + '</span>' +
          (e.voice ? '<span class="pill">🎙 ' + esc(e.voice) + '</span>' : "") +
        '</div>' +
        musicRow(e.music) +
        note +
        '<p class="cap">' + esc(e.caption) + '</p>' +
        '<div class="actions">' +
          '<button class="btn" data-copy="' + esc(e.caption + " " + (e.hashtags || []).join(" ")) + '">Caption kopyala</button>' +
          right +
        '</div>' +
        '<div class="actions">' + manage + '</div>' +
      '</div>' +
    '</article>';
  }).join("");

  // Videonu yalnız həqiqətən mövcuddursa göstər; Release hələ yoxdursa placeholder qalır
  grid.querySelectorAll(".slot").forEach((slot) => {
    const v = document.createElement("video");
    v.controls = true; v.preload = "metadata"; v.playsInline = true;
    v.onloadedmetadata = () => { slot.innerHTML = ""; slot.appendChild(v); };
    v.src = slot.dataset.src;
  });

  grid.querySelectorAll("[data-copy]").forEach((b) => {
    b.onclick = async () => {
      await navigator.clipboard.writeText(b.dataset.copy);
      const t = b.textContent; b.textContent = "Kopyalandı ✓";
      setTimeout(() => { b.textContent = t; }, 1600);
    };
  });
}

document.getElementById("grid").addEventListener("click", async (ev) => {
  const a = ev.target.closest("[data-act]");
  if (!a || !getToken()) return;                       // token yoxdursa adi link işləsin
  ev.preventDefault();
  const id = a.dataset.id, act = a.dataset.act;
  let title, body;
  if (act === "publish") {
    if (!confirm("Bu video İNDİ Instagram + Facebook-a yayımlansın?" + NL + NL + id)) return;
    title = "Yayımla: " + id; body = "Paneldən bir-klik ilə yayımlandı.";
  } else if (act === "change") {
    const noteText = prompt("Nə dəyişməlidir? (qeyd ssenari modelinə gedir, video yenidən istehsal olunur)");
    if (!noteText || !noteText.trim()) return;
    title = "Dəyişiklik: " + id; body = noteText.trim();
  } else {
    if (!confirm("Bu video silinsin? (Release ləğv olunur, paneldən çıxır)")) return;
    title = "Sil: " + id; body = "Paneldən silindi.";
  }
  a.style.opacity = ".5"; a.style.pointerEvents = "none";
  try {
    const issue = await createIssue(title, body);
    const msg = act === "publish" ? "🚀 Yayımlanır — Instagram emalı ~2–3 dəq. " :
                act === "change"  ? "🔄 Yenidən istehsal başladı, ~7 dəq. " : "🗑 Silinir… ";
    toast(msg + '<a href="' + issue.html_url + '" target="_blank" rel="noopener">İzlə</a>', 9000);
    if (act === "publish") {
      const e = DATA.entries.find((x) => x.id === id);
      if (e) e.status = "yayımlanır";
      render();
    }
  } catch (err) {
    toast("Xəta: " + esc(err.message), 9000);
    a.style.opacity = ""; a.style.pointerEvents = "";
  }
});

function stats() {
  const n = (s) => DATA.entries.filter((e) => e.status === s).length;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>' + DATA.entries.length + '</b><small>cəmi</small></div>' +
    '<div class="stat"><b>' + n("təsdiq-gözləyir") + '</b><small>gözləyir</small></div>' +
    '<div class="stat"><b>' + n("yayımlanıb") + '</b><small>yayımlanıb</small></div>';
}

document.getElementById("tabs").onclick = (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t === b)));
  render();
};

refreshGear();
fetch("data.json?" + Date.now())
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error("yox"))))
  .then((d) => {
    DATA = d;
    document.getElementById("updated").textContent = "Son yenilənmə: " + new Date(d.updatedAt).toLocaleString("az-AZ");
    document.getElementById("repo").textContent = d.repo;
    stats(); render();
  })
  .catch(() => {
    document.getElementById("updated").textContent = "Məlumat tapılmadı";
    document.getElementById("empty").hidden = false;
  });
</script>
</body>
</html>
